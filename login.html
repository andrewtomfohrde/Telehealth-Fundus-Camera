<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Motor Stream — Login</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0d0d;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e0e0e0;
        }

        .card {
            width: 100%;
            max-width: 380px;
            padding: 2.5rem 2rem;
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo svg {
            width: 44px;
            height: 44px;
            margin-bottom: 0.75rem;
        }

        .logo h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: #fff;
        }

        .logo p {
            font-size: 0.8rem;
            color: #555;
            margin-top: 0.25rem;
        }

        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.4rem;
        }

        .field { margin-bottom: 1.1rem; }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.65rem 0.9rem;
            background: #1e1e1e;
            border: 1px solid #2e2e2e;
            border-radius: 7px;
            color: #e0e0e0;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #00c8ff;
        }

        .error {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 70, 70, 0.1);
            border: 1px solid rgba(255, 70, 70, 0.3);
            color: #ff6b6b;
            font-size: 0.85rem;
            padding: 0.6rem 0.9rem;
            border-radius: 7px;
            margin-bottom: 1.2rem;
        }

        button[type="submit"] {
            width: 100%;
            padding: 0.75rem;
            background: #00c8ff;
            color: #000;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            letter-spacing: 0.03em;
            transition: background 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }

        button[type="submit"]:hover  { background: #33d4ff; }
        button[type="submit"]:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <!-- camera + gear icon -->
            <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="44" height="44" rx="10" fill="#1a1a1a"/>
                <path d="M8 16a3 3 0 013-3h4l2-3h10l2 3h4a3 3 0 013 3v14a3 3 0 01-3 3H11a3 3 0 01-3-3V16z"
                      stroke="#00c8ff" stroke-width="1.8" fill="none"/>
                <circle cx="22" cy="23" r="5" stroke="#00c8ff" stroke-width="1.8" fill="none"/>
                <circle cx="22" cy="23" r="2" fill="#00c8ff"/>
            </svg>
            <h1>Motor Stream</h1>
            <p>Raspberry Pi Control Panel</p>
        </div>

        {% if error %}
        <div class="error">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 1a7 7 0 100 14A7 7 0 008 1zm-.75 4a.75.75 0 011.5 0v3.5a.75.75 0 01-1.5 0V5zm.75 7a1 1 0 110-2 1 1 0 010 2z"/>
            </svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password">
            </div>
            <button type="submit">Sign in</button>
        </form>
    </div>
</body>
</html>
